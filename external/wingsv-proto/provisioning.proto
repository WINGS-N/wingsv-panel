syntax = "proto3";

package wingsv.provisioning.v1;

option go_package = "v.wingsnet.org/internal/gen/provisioningpb;provisioningpb";

// Provisioning is served by the panel and called by a vk-turn-proxy node over
// gRPC during app self-enroll. The node forwards the client's panel token from
// the DTLS PROVISION exchange; the panel verifies it and returns (creating on
// first use) the client's WireGuard config for that node. HWID travels for
// information only and never gates access.
service Provisioning {
  rpc ResolveClientConfig(ResolveClientConfigRequest) returns (ResolveClientConfigResponse);
  // GetClientUsage returns the traffic-limit usage of the capped or disabled
  // managed clients that hold a wg peer on the calling node. The relay polls it
  // and surfaces used/remaining to the app (e.g. in its DTLS heartbeat) and can
  // also enforce a hard cutoff. Clients with no cap and not disabled are omitted.
  rpc GetClientUsage(GetClientUsageRequest) returns (GetClientUsageResponse);
}

message ResolveClientConfigRequest {
  string client_id = 1;
  bytes token = 2;
  string hwid = 3;
  string node_id = 4;
  // When set, the calling node is reporting a wg peer it just minted locally for
  // this client (the own-wg provision-locally path): the panel records it instead
  // of calling back the node's management API. Empty on the initial resolve.
  string wg_public_key = 5;
  string wg_private_key = 6;
  string wg_allowed_ips = 7;
  string wg_server_public_key = 8;
}

message ResolveClientConfigResponse {
  WireguardConfig wg = 1;
  // provision_locally tells an own-wg node to mint the peer on its own interface
  // and re-call ResolveClientConfig with the wg_* fields to record it, instead of
  // the panel dialing the node's management API - which is a re-entrant call made
  // while the node is blocked inside its own provision handler, and breaks.
  bool provision_locally = 2;
}

message GetClientUsageRequest {
  string node_id = 1;
}

message GetClientUsageResponse {
  repeated ClientUsage usage = 1;
}

// ClientUsage is one managed client's traffic-limit state on the calling node,
// keyed by its wg peer public key so the relay can match it to a live session.
message ClientUsage {
  string public_key = 1;
  string client_id = 2;
  uint64 limit_bytes = 3;      // 0 when the client is disabled but uncapped
  uint64 used_bytes = 4;
  uint64 remaining_bytes = 5;  // limit_bytes - used_bytes, floored at 0
  bool disabled = 6;           // manually cut off regardless of the cap
}

message WireguardConfig {
  // Client private key, set only when the node generated the keypair.
  string private_key = 1;
  string public_key = 2;
  // Assigned tunnel address, e.g. 10.66.66.2/32.
  string address = 3;
  string server_public_key = 4;
  // Traffic the tunnel should carry, e.g. 0.0.0.0/0.
  string allowed_ips = 5;
  uint32 mtu = 6;
}
