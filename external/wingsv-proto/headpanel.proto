// Head to panel. Separate from federation.proto because the peers are different:
// this side is the operator's own panel, the other side is somebody else's server
syntax = "proto3";

package wingsv.headpanel.v1;

option go_package = "wingsnet.org/federation/gen/headpb;headpb";

service FederationHead {
  // Aggregates for the public landing page. Deliberately the narrowest message
  // in this file: it is served to anybody
  rpc GetPublicCounters(PublicCountersRequest) returns (PublicCounters);
  // One long-lived stream so the panel can change what it is watching without
  // dialing again
  rpc StreamLive(stream LiveSubscribe) returns (stream LiveUpdate);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // What a donor is allowed to see about their own contribution. Aggregates
  // only: there is no RPC anywhere in this service that maps a node to a profile
  // or to a user, and adding one would break the privacy invariant
  rpc DonorSummary(DonorSummaryRequest) returns (DonorCounters);
  // Помесячная разбивка того же вклада. Счётчик за период обнуляется, и без
  // истории донору нечего показать за прошлый месяц.
  rpc DonorHistory(DonorHistoryRequest) returns (DonorHistoryResponse);
  // Gives a free user nodes, or returns what they already have. Idempotent, so
  // the panel can call it on every login without moving anybody
  rpc EnsureUser(EnsureUserRequest) returns (UserAllocation);
  // Takes a user off every node. Used when the oracle quarantines somebody
  rpc RevokeUser(RevokeUserRequest) returns (RevokeUserResponse);
  rpc MintEnrollToken(MintEnrollTokenRequest) returns (MintEnrollTokenResponse);
  rpc SetNodeState(SetNodeStateRequest) returns (SetNodeStateResponse);
  // Сколько трафика донор обещает в этом месяце. Меняется на живой ноде: пока
  // этого не было, поднять лимит можно было только перезачислением, теряя
  // личность ноды, результаты зондов и уже посчитанный за период трафик.
  rpc SetNodeBudget(SetNodeBudgetRequest) returns (SetNodeBudgetResponse);
  // Настройки всего флота: какие сборки нести, чем прикрываться, обновляться ли
  // самим. Это решение оператора, а не донора и не флага на ноде.
  rpc GetFleetSettings(FleetSettingsRequest) returns (FleetSettings);
  rpc SetFleetSettings(FleetSettings) returns (FleetSettings);
  // Перезапустить компонент. Пустой node_id - на всём флоте.
  rpc RestartComponent(RestartComponentRequest) returns (RestartComponentResponse);
  // Что намеряли точки наблюдения внутри цензурируемой сети. Единственный
  // источник правды о том, работает ли нода там, где сидят люди.
  rpc ProbeReports(ProbeReportsRequest) returns (ProbeReportsResponse);
  // Замерить прямо сейчас, не дожидаясь круга. Круг идёт раз в пять минут, и
  // проверить только что поднятую ноду иначе нечем.
  rpc RunProbes(RunProbesRequest) returns (RunProbesResponse);
  // Состояние Oracle: кого он смотрит, что решил и на основании чего.
  rpc OracleOverview(OracleOverviewRequest) returns (OracleOverviewResponse);
  // Один субъект целиком: вердикт, вклад классов и сырые сигналы. Отвечает на
  // вопрос "за что", который иначе остаётся без ответа.
  rpc OracleSubject(OracleSubjectRequest) returns (OracleSubjectResponse);
  // Судим и ноды тоже: враньё о трафике, провалы зондов, мигание
  rpc OracleNodes(OracleNodesRequest) returns (OracleNodesResponse);
}

enum LiveScope {
  LIVE_SCOPE_UNSPECIFIED = 0;
  LIVE_SCOPE_GLOBAL = 1;
  LIVE_SCOPE_DONOR = 2;
  LIVE_SCOPE_NODE = 3;
}

message LiveSubscribe {
  LiveScope scope = 1;
  // Set for DONOR and NODE scope respectively
  string donor_id = 2;
  string node_id = 3;
}

message LiveUpdate {
  int64 unix_ms = 1;
  GlobalCounters global = 2;
  DonorCounters donor = 3;
  NodeCounters node = 4;
}

message GlobalCounters {
  uint32 nodes_total = 1;
  uint32 nodes_online = 2;
  uint32 sessions = 3;
  uint32 streams = 4;
  uint64 up_bytes = 5;
  uint64 down_bytes = 6;
  double up_rate_bps = 7;
  double down_rate_bps = 8;
  // Since the federation started, not since this period or this process.
  // Survives a restart, and a node leaving does not take its share away with it
  uint64 lifetime_bytes = 9;
  // С начала текущего периода бюджета. Считается от сохранённой отметки, а не
  // от счётчиков в памяти, поэтому переживает выкат головы
  uint64 period_bytes = 10;
  // Часть перенесённого, которую сожгли проверки зондов. Донору это считается
  // как обычный трафик, но он вправе знать, сколько ушло на наши замеры
  uint64 probe_bytes = 11;
}

// PublicCounters is what the landing page shows. No node ids, no donor ids, no
// per-node breakdown: this is served without a session
message PublicCounters {
  int64 unix_ms = 1;
  uint32 nodes_online = 2;
  uint32 users_online = 3;
  uint64 donated_bytes_this_period = 4;
  double up_rate_bps = 5;
  double down_rate_bps = 6;
  // Everything the federation has ever carried. The period figure resets and
  // makes the effort look smaller than it was; this one is the honest total
  uint64 lifetime_bytes = 7;
  // Сколько из перенесённого ушло на проверки зондов
  uint64 probe_bytes = 8;
}

message PublicCountersRequest {}

message DonorCounters {
  string donor_id = 1;
  uint32 nodes = 2;
  uint32 nodes_online = 3;
  uint32 sessions = 4;
  uint64 up_bytes = 5;
  uint64 down_bytes = 6;
  double up_rate_bps = 7;
  double down_rate_bps = 8;
  uint64 declared_budget_bytes = 9;
  uint64 used_bytes = 10;
  // Сколько из used_bytes сожгли проверки зондов
  uint64 probe_bytes = 11;
}

message DonorSummaryRequest {
  string donor_id = 1;
}

message DonorHistoryRequest {
  string donor_id = 1;
  // Сколько последних месяцев вернуть, 0 - двенадцать
  uint32 months = 2;
}

// DonorMonth - один месяц вклада донора, закрытый или текущий. Month в формате
// YYYY-MM по UTC: граница, плывущая вместе с часовым поясом читателя, показала
// бы двум людям разные суммы.
message DonorMonth {
  string month = 1;
  uint64 bytes = 2;
}

message DonorHistoryResponse {
  repeated DonorMonth months = 1;
}

message NodeCounters {
  string node_id = 1;
  string state = 2;
  string reason = 3;
  uint32 sessions = 4;
  double up_rate_bps = 5;
  double down_rate_bps = 6;
  uint64 used_bytes = 7;
  uint64 declared_budget_bytes = 8;
  int64 last_seen_unix = 9;
  // Сколько из used_bytes сожгли проверки зондов
  uint64 probe_bytes = 11;
  bool online = 10;
}

message ListNodesRequest {
  // Empty lists the whole fleet, which only the operator may ask for
  string donor_id = 1;
}

message ListNodesResponse {
  repeated NodeSummary nodes = 1;
}

message NodeSummary {
  // Порты, которые нода реально заняла, и цель, чью tls-личность она
  // заимствует. У каждой ноды свои: общие на флот - один признак для блокировки
  repeated uint32 offered_ports = 20;
  string reality_dest = 21;
  string node_id = 1;
  string donor_id = 2;
  string hostname = 3;
  string arch = 4;
  string state = 5;
  string reason = 6;
  bool online = 7;
  bool aes_ni = 8;
  uint64 declared_budget_bytes = 9;
  uint64 used_bytes = 10;
  int64 joined_unix = 11;
  int64 last_seen_unix = 12;
  NodeCounters live = 13;
  // Сборки, которые нода несёт на самом деле
  string xray_version = 22;
  string vktp_version = 23;
  // Сколько из used_bytes сожгли проверки зондов
  uint64 probe_bytes = 24;
}

message MintEnrollTokenRequest {
  string donor_id = 1;
  uint32 ttl_seconds = 2;
  // Сколько гигабайт в месяц донор отдаёт с этой машины. Ноль означает общий
  // потолок площадки: раньше он был единственным, и лимит приходилось править
  // уже после того, как сервер зашёл
  uint32 budget_gb = 4;
  // How many nodes may join on this one token. Zero and one both mean one.
  //
  // It exists for a donor bringing a fleet rather than a machine: a DaemonSet
  // enrols every host it lands on from one Secret, and minting per host would
  // mean one release per host. The single-use default stands for the paste-one-
  // command case, where a token that outlives its node is a token somebody else
  // can use.
  uint32 uses = 3;
}

message MintEnrollTokenResponse {
  // The compound value the installer takes verbatim. It carries the fleet
  // secret as well, because the transport is keyed before the node has one
  string enroll_token = 1;
  int64 expires_unix = 2;
  // The whole command a donor pastes. Built by the head because the head is what
  // knows its own public address and serves the installer; a panel guessing at it
  // is a panel handing out a link to a 404
  string install_command = 3;
  // How many joins this token still authorises when it was issued
  uint32 uses = 4;
}

message EnsureUserRequest {
  // Opaque to the head. The panel's own identifier, never an address or a handle
  string user_id = 1;
}

message UserAllocation {
  string user_id = 1;
  // The subscription URL the client fetches. Unguessable and unrelated to
  // user_id, because it travels through screenshots and chat logs
  string subscription_url = 2;
  // How many nodes are serving this user. Deliberately not which ones: the panel
  // has no business joining a user to a donor's machine
  uint32 nodes = 3;
  int64 sticky_until_unix = 4;
  // Сколько нод полагается по уровню доверия. Отличается от nodes, когда во
  // флоте нечего выдать: две ноды одного донора падают вместе, и вторую такую
  // не дают. Без этой цифры кабинет не может объяснить, почему сервер один
  uint32 nodes_entitled = 5;
  // Сколько пользователь пронёс за текущий период
  uint64 used_bytes = 6;
  // Потолки скорости, байт в секунду. Соразмерны оценке оракула
  uint64 uplink_bps = 7;
  uint64 downlink_bps = 8;
}

message RevokeUserRequest {
  string user_id = 1;
}

message RevokeUserResponse {}

message SetNodeStateRequest {
  string node_id = 1;
  string state = 2;
  string reason = 3;
}

message SetNodeStateResponse {}

message FleetSettingsRequest {}

// FleetSettings - то, что оператор задаёт один раз на весь флот.
message FleetSettings {
  // Сборки. Пустой url означает "не трогать": нода продолжит нести то, что уже
  // поставила, а не останется без Xray.
  BuildChoice xray = 1;
  BuildChoice vktp = 2;
  // Ставить новую сборку сразу, как только она приехала. Перезапуск рвёт живые
  // соединения, поэтому по умолчанию выключено.
  bool auto_upgrade = 3;
  // Чью tls-личность занимает REALITY. Пусто и auto_dest - голова выбирает сама
  // из проверенного пула.
  string reality_dest = 4;
  bool auto_dest = 5;
  // ML-DSA-65 поверх REALITY. Помещается не в каждый заимствованный хендшейк,
  // поэтому переключатель, а не константа.
  bool post_quantum = 6;
  uint32 tcp_port = 7;
  uint32 xhttp_port = 8;
  // Версия конфига, которую голова разослала после последнего изменения
  uint64 config_version = 9;
  // Сколько целей в проверенном пуле. Ноды разводятся по нему, поэтому dest в
  // поле выше - лишь та, что досталась бы ноде без своей записи
  uint32 dest_pool_size = 10;
}

message BuildChoice {
  string version = 1;
  string url = 2;
  string sha512 = 3;
}

message RestartComponentRequest {
  // xray | vktp
  string component = 1;
  // Пусто - весь флот
  string node_id = 2;
}

message RestartComponentResponse {
  uint32 nodes = 1;
}

message SetNodeBudgetRequest {
  string node_id = 1;
  uint64 declared_budget_bytes = 2;
}

message SetNodeBudgetResponse {
  uint64 declared_budget_bytes = 1;
  uint64 used_bytes = 2;
}

message ProbeReportsRequest {
  // Страница замеров. Их число растёт как ноды на адреса и транспорты, и
  // отдавать всё разом значит гонять по сети список, который никто не читает
  uint32 limit = 1;
  uint32 offset = 2;
}

message RunProbesRequest {}

message RunProbesResponse {
  uint32 probes = 1;
}

// ProbeVantage - одна точка наблюдения, как она себя представила
message ProbeVantage {
  string probe_id = 1;
  string region = 2;
  string isp = 3;
  string asn = 4;
  string version = 5;
  bool online = 6;
  int64 last_seen_unix = 7;
  uint32 measurements = 8;
}

// ProbeMeasurement - один адрес одной ноды, померенный по одному транспорту
message ProbeMeasurement {
  string node_id = 1;
  string hostname = 2;
  string address = 3;
  string transport = 4;
  bool ok = 5;
  uint32 handshake_ms = 6;
  uint32 rtt_ms = 7;
  uint64 download_bps = 8;
  string error = 9;
  string probe_id = 10;
  int64 at_unix = 11;
}

message ProbeReportsResponse {
  repeated ProbeVantage vantages = 1;
  repeated ProbeMeasurement measurements = 2;
  // Всего замеров под запрос, до нарезки на страницу
  uint32 total = 3;
}

message OracleOverviewRequest {
  // Сколько подозреваемых вернуть, 0 - двадцать
  uint32 limit = 1;
  uint32 offset = 3;
  // Когда список задан, отдаются вердикты только по нему. Так панель считает
  // ветку инвайт-дерева: голова про дерево не знает и знать не должна
  repeated string subject_ids = 2;
}

message OracleSubjectRequest {
  string subject_id = 1;
}

// OracleSignal - сырое наблюдение, которое хранится ради ответа на вопрос
// "за что"
message OracleSignal {
  string kind = 1;
  uint32 count = 2;
  int64 at_unix = 3;
  string node_id = 4;
  uint32 window_seconds = 5;
}

// OracleDomain - куда субъект ходил чаще всего. Показывается владельцу площадки,
// донору эти данные не отдаются никогда: он и так видит только агрегаты
message OracleDomain {
  string domain = 1;
  int64 hits = 2;
  uint64 up_bytes = 3;
  uint64 down_bytes = 4;
  int64 last_seen_unix = 5;
}

message OracleSubjectResponse {
  OracleSubject subject = 1;
  repeated OracleSignal signals = 2;
  repeated OracleDomain domains = 3;
}

// OracleNode - доверие к ноде. Отдельная шкала от людской: у ноды другие грехи
// и другие последствия
message OracleNode {
  string node_id = 1;
  string hostname = 2;
  string donor_id = 3;
  int32 trust = 4;
  // Про ВЫПЛАТЫ, не про выдачу: тёмную ноду из ротации убирают зонды, а тут
  // решается, сколько ей причитается
  bool payout_reduced = 5;
  bool payout_stopped = 6;
  // Reasons - за что именно, чтобы донору было что предъявить
  repeated OracleNodeReason reasons = 7;
  // Probes - как нода выглядит из страны, Uptime - сколько держится
  uint32 probe_ok = 8;
  uint32 probe_failed = 9;
  double uptime_pct = 10;
  int64 last_seen_unix = 11;
}

message OracleNodeReason {
  string reason = 1;
  double weight = 2;
}

message OracleNodesRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message OracleNodesResponse {
  repeated OracleNode nodes = 1;
  uint32 total = 2;
  // Accused - скольким нодам есть что предъявить
  uint32 accused = 3;
}

// OracleClass - один класс сигнала и во что он обошёлся субъекту
message OracleClass {
  string kind = 1;
  uint32 count = 2;
  double weight = 3;
  // Доля этого класса среди всех сигналов за сутки, процентов
  double share_pct = 4;
  // Сколько субъектов словили этот класс
  uint32 subjects = 5;
}

// OracleSubject - вердикт вместе с тем, что к нему привело. Субъект тут
// профиль, а не человек: у головы нет ни имени, ни почты, ни адреса
message OracleSubject {
  string subject_id = 1;
  int32 confidence = 2;
  string band = 3;
  string scorer = 4;
  int64 at_unix = 5;
  repeated OracleClass classes = 6;
  // Теневой скорер считает параллельно и ничего не решает
  string shadow_band = 7;
  int32 shadow_confidence = 8;
}

message OracleOverviewResponse {
  // Всего наблюдаемых, до нарезки на страницу
  uint32 total = 10;
  uint32 offset = 11;
  // Сколько субъектов под обвинением: на них есть сигналы. Полосы ниже считаются
  // по всем, кому выдан доступ, а не только по обвиняемым - иначе спокойные
  // пользователи в счётчиках не видны вовсе
  uint32 watched = 1;
  // Всем, кому выдан доступ
  uint32 subjects_total = 12;
  uint32 full = 2;
  uint32 reduced = 3;
  uint32 quarantined = 4;
  repeated OracleSubject subjects = 5;
  // Сигналы за сутки по классам
  repeated OracleClass signals = 6;
  string scorer = 7;
  string shadow_scorer = 8;
}
