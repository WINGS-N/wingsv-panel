# Cluster prerequisites, not installed by this chart: the CNPG operator (for the
# bundled database), cert-manager with a ClusterIssuer, and Traefik. If they are
# already in the cluster - and they are - nothing here duplicates them; the chart
# only creates the custom resources they act on.

# Where everything lands. Set on purpose so a plain "helm install" puts the panel
# in wingsvpn. Helm still records the release in the namespace of -n, so pass
# "-n wingsvpn" too or "helm list -n wingsvpn" will come back empty.
namespace: wingsvpn

# Object names are built from this, not from the release name: panel,
# panel-grpc, panel-pg, panel-config, panel-secrets, panel-tls.
nameOverride: panel

image:
  repository: ghcr.io/wings-n/wingsv-panel
  tag: latest
  pullPolicy: Always

replicas: 1
# RollingUpdate is right on Postgres. On sqlite set this to Recreate: a rolling
# update would have two pods fighting over one RWO volume and one writer.
strategy: RollingUpdate

config:
  publicBaseURL: "https://v.wingsnet.org"
  githubRepo: "WINGS-N/WINGSV"
  releaseAssetSuffix: ".apk"
  sessionSecure: true
  # The plaintext h2c listener the proxy forwards provisioning gRPC to. Nodes
  # verify the panel by system trust at the edge, so there is no pin here.
  provisioningListen: ":9091"

# The bundled database. CNPG runs it; this chart only declares the Cluster and
# the credentials, and renders the DSN the panel reads.
postgres:
  enabled: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  database: wingsv
  owner: wingsv
  # Required. Seeds the database and is what the rendered DSN carries.
  password: ""
  sslmode: require
  parameters:
    max_connections: "300"
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi
  nodeSelector: {}
  # One-shot logical import from an existing cluster, for moving the database
  # between namespaces. CNPG runs it at creation and never again - changing
  # these fields later has no effect, the cluster has to be recreated. Turn it
  # off once the move is done so a future recreate starts empty rather than
  # silently re-importing stale data.
  import:
    enabled: false
    # e.g. wingsv-pg-rw.v-wingsnet.svc.cluster.local
    host: ""
    database: ""
    owner: ""
    sslmode: require

database:
  # sqlite | pgsql | mariadb. With postgres.enabled the chart supplies the DSN
  # itself and dsnSecret is ignored.
  driver: pgsql
  dsnSecret:
    name: ""
    key: dsn
  # sqlite only
  path: /data/v-wingsnet.db

bootstrap:
  # Changed on first login. Left at the default it is exactly as bad as it looks.
  username: admin
  password: ""

federation:
  enabled: false
  # Panel-facing gRPC of the head. Its own secret, never the fleet secret: that
  # one is held by every donated node.
  head: ""
  secret: ""

# Единая дверь во все наши сервисы. Механизм - обычный OIDC, но issuer ПИНИТСЯ:
# пускаем только свой провайдер, иначе инвайт-дерево теряет смысл - любой чужой
# начнёт штамповать личности бесплатно.
# Выключено - панель живёт на своём пароле, и админ, поднявший её у себя, про
# OIDC не узнает вовсе
oidc:
  enabled: false
  issuer: ""
  clientID: ""
  clientSecret: ""
  # Что написано на кнопке входа
  name: "WINGS Account"

relayToken: ""

existingSecret: ""

# cert-manager is expected to be in the cluster already. The chart asks it for a
# certificate; it does not install it.
certificate:
  enabled: true
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  extraDNSNames: []

persistence:
  # Only sqlite needs it. On Postgres the panel holds nothing worth a volume.
  enabled: false
  size: 2Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: v.wingsnet.org
  annotations:
    # Without this the router attaches to every entrypoint, including metrics and
    # ssh - where an HTTP router breaks TCP passthrough for anything else on it.
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  tls:
    enabled: true
    # Empty means panel-tls, issued by the Certificate above.
    secretName: ""
  # Provisioning gRPC is h2c and needs a Traefik IngressRoute; a plain Ingress
  # has no way to say the backend speaks cleartext HTTP/2.
  provisioning:
    enabled: true
    path: /wingsv.provisioning.v1.Provisioning/

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
