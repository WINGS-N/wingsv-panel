{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "panel.name" . }}-data
  namespace: {{ include "panel.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
{{- end }}
{{- end }}
