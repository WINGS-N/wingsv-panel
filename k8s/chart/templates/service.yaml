apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.config.provisioningListen }}
    # Plaintext h2c. The ingress terminates TLS and forwards the provisioning
    # gRPC here, so a node verifies the panel by system trust with no pin.
    - name: provisioning
      port: {{ .Values.config.provisioningListen | trimPrefix ":" | int }}
      targetPort: provisioning
{{- end }}
