apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "panel.name" . }}-config
  namespace: {{ include "panel.namespace" . }}
data:
  LISTEN_ADDR: ":{{ .Values.service.targetPort }}"
  PUBLIC_BASE_URL: {{ .Values.config.publicBaseURL | quote }}
  GITHUB_REPO: {{ .Values.config.githubRepo | quote }}
  RELEASE_ASSET_SUFFIX: {{ .Values.config.releaseAssetSuffix | quote }}
  SESSION_SECURE: {{ .Values.config.sessionSecure | quote }}
  PROVISIONING_LISTEN: {{ .Values.config.provisioningListen | quote }}
  DB_KIND: {{ .Values.database.driver | quote }}
{{- if eq .Values.database.driver "sqlite" }}
  DB_PATH: {{ .Values.database.path | quote }}
{{- end }}
  BOOTSTRAP_ADMIN_USERNAME: {{ .Values.bootstrap.username | quote }}
{{- if .Values.federation.enabled }}
  FEDERATION_HEAD: {{ required "federation.head is required when the federation is enabled" .Values.federation.head | quote }}
{{- end }}
{{- if .Values.oidc.enabled }}
  OIDC_ISSUER: {{ required "oidc.issuer is required when the login is enabled" .Values.oidc.issuer | quote }}
  MATRIX_HOMESERVER: {{ required "oidc.homeserver is required when the login is enabled" .Values.oidc.homeserver | quote }}
  OIDC_CLIENT_ID: {{ required "oidc.clientID is required when the login is enabled" .Values.oidc.clientID | quote }}
{{- end }}
