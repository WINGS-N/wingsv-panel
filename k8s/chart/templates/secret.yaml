{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "panel.name" . }}-secrets
  namespace: {{ include "panel.namespace" . }}
type: Opaque
stringData:
  BOOTSTRAP_ADMIN_PASSWORD: {{ required "bootstrap.password is required: the default is exactly as bad as it looks" .Values.bootstrap.password | quote }}
{{- if .Values.relayToken }}
  RELAY_TOKEN: {{ .Values.relayToken | quote }}
{{- end }}
{{- if .Values.federation.enabled }}
  # The panel's own secret for the head. Never the fleet secret - that one is
  # held by every donated node, and handing it over here would give a donor the
  # operator's view of the federation.
  FEDERATION_SECRET: {{ required "federation.secret is required when the federation is enabled" .Values.federation.secret | quote }}
{{- end }}
{{- if .Values.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  # Ключ сервисного пользователя провайдера: с ним форму входа рисует панель, без
  # него остаётся кнопка на его собственную страницу
  ACCOUNT_API_TOKEN: {{ .Values.oidc.apiToken | default "" | quote }}
{{- end }}
{{- end }}
