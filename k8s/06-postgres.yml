# HA Postgres for the stateless multi-replica panel (see docs/HA.md), managed by
# the CloudNativePG operator. It is both the source of truth and the LISTEN/NOTIFY
# bus. CNPG generates a wingsv-pg-app secret (username/password/dbname/uri) and
# a wingsv-pg-rw service pointing at the primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wingsv-pg
  namespace: v-wingsnet
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: wingsv
      owner: wingsv
  postgresql:
    parameters:
      max_connections: "200"
  storage:
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
