# Multi-replica HA variant of the app Deployment. Apply this instead of
# 04-app.yml when running the panel stateless behind a shared Postgres database.
#
# Requirements (see docs/HA.md):
#   - The config map sets DB_KIND=pgsql and DB_DSN to the shared Postgres. That
#     database is the single source of truth AND the cross-replica bus
#     (LISTEN/NOTIFY), so admin fanout and device ConfigPush reach whichever
#     replica holds a given WS. No PVC is mounted: the pods are stateless.
#   - The pinned CA (for SPKI-pin deploys) is a shared Secret so every replica
#     serves the same pin; leaf certs rotate freely under it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: v-wingsnet
spec:
  replicas: 2
  # Postgres has no single-writer limit and the bus is external to the pods, so a
  # rolling update brings replicas up/down without a stateful handoff.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/wings-n/wingsv-panel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: v-wingsnet-config
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /up
              port: 8080
            failureThreshold: 20
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
