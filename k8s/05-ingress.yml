apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: v-wingsnet
  annotations:
    cert-manager.io/issuer: "letsencrypt-http"
    # Иначе роутеры цепляются ко ВСЕМ entrypoint'ам (metrics:9101, traefik:8080, ssh:2260):
    # приложение светится на служебных портах, а на ssh HTTP-роутер глушит TCP-проксирование
    # git-over-SSH у Forgejo (Traefik ждёт HTTP-запрос → SSH-баннер не отдаётся).
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - v.wingsnet.org
      secretName: v-wingsnet-tls
  rules:
    - host: "v.wingsnet.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
